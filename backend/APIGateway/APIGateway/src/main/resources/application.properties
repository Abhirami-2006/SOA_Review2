spring.application.name=APIGateway

server.port=9000

# ===============================
# Eureka
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Gateway Routes - Spring MVC
# Local defaults work without Eureka; override these URLs for deployed services.
# ===============================

spring.cloud.gateway.mvc.routes[0].id=AuthService
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:9004}
spring.cloud.gateway.mvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[0].predicates[0].args[pattern]=/auth/**

spring.cloud.gateway.mvc.routes[1].id=AuctionService
spring.cloud.gateway.mvc.routes[1].uri=${AUCTION_SERVICE_URL:http://localhost:9101}
spring.cloud.gateway.mvc.routes[1].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[1].predicates[0].args[pattern]=/auctions/**

spring.cloud.gateway.mvc.routes[2].id=BiddingService
spring.cloud.gateway.mvc.routes[2].uri=${BIDDING_SERVICE_URL:http://localhost:9002}
spring.cloud.gateway.mvc.routes[2].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[2].predicates[0].args[pattern]=/bids/**

spring.cloud.gateway.mvc.routes[3].id=PaymentService
spring.cloud.gateway.mvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:9003}
spring.cloud.gateway.mvc.routes[3].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[3].predicates[0].args[pattern]=/payments/**

# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always